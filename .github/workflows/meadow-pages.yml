name: Meadow Days Pages

on:
  pull_request:
    branches: [master]
    paths:
      - 'game/**'
      - '.github/workflows/meadow-pages.yml'
  push:
    branches: [master]
    paths:
      - 'game/**'
      - '.github/workflows/meadow-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meadow-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test and package game
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run native regression tests
        run: npm --prefix game test
      - name: Package the static game
        run: npm --prefix game run build:pages
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: game/dist

  deploy:
    name: Deploy game to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
